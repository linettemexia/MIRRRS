<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIRRRS Models</title>
<link rel="icon" type="image/svg+xml" href="logo-monogram.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ========== TOP NAV ========== -->
<header class="site-nav">
  <a href="index.html" class="logo">
    <span class="logo-mark">MIRRRS</span>
    <span class="logo-sub">Models</span>
  </a>

  <nav class="primary-nav">
    <a href="models.html" data-i18n="nav.models">Models</a>
    <a href="newsletter.html" data-i18n="nav.newsletter">Newsletter</a>
    <a href="about.html" data-i18n="nav.about">About</a>
    <a href="contact.html" data-i18n="nav.contact">Contact</a>
    <a href="apply.html" data-i18n="nav.apply">Become a Model</a>
  </nav>

  <div class="nav-extras">
    <a class="ig-link" href="https://www.instagram.com/mirrrsmodels/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="5" />
        <circle cx="12" cy="12" r="4" />
        <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none" />
      </svg>
    </a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en" class="is-active">EN</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-lang="de">DE</button>
    </div>
  </div>
</header>

<main class="model-page">

  <!-- Filled in by JS from mediaslide.js -->
  <section class="model-header">
    <div>
      <div class="model-name-row">
        <h1 class="model-name" id="model-name">Loading…</h1>
        <a class="model-ig" id="model-ig-link" href="#" target="_blank" rel="noopener" aria-label="Instagram" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="15" height="15">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
          </svg>
          Instagram
        </a>
      </div>
    </div>
    <div class="model-actions">
      <button type="button" data-i18n="model.addToPackage">Add to package</button>
      <a href="#" download data-i18n="model.downloadPdf">Download PDF</a>
    </div>
  </section>

  <ul class="model-stats" id="model-stats"></ul>

  <h2 class="section-title" data-i18n="model.book">Book</h2>
  <div class="book-container">
    <button class="book-arrow book-arrow--left" aria-label="Previous">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M9 1L3 7L9 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="book-arrow book-arrow--right" aria-label="Next">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M5 1L11 7L5 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <section class="book" id="book"></section>
    <div class="book-progress" aria-hidden="true">
      <div class="book-progress-bar"></div>
    </div>
  </div>

  <h2 class="section-title fade-in" data-i18n="model.polaroids">Polaroids</h2>
  <section class="polaroids">
    <div class="polaroid-grid" id="polaroid-grid"></div>
  </section>

</main>

<!-- ========== LIGHTBOX ========== -->
<div class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" aria-label="Close">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M4 4L16 16M16 4L4 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="lightbox-prev" aria-label="Previous image">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M13 2L5 10L13 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="lightbox-next" aria-label="Next image">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M7 2L15 10L7 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <img class="lightbox-img" src="" alt="" />
  <div class="lightbox-counter">1 / 1</div>
</div>

<footer class="site-footer">
  <a href="index.html" class="logo logo--footer">
    <span class="logo-mark">MIRRRS</span>
    <span class="logo-sub">Models</span>
  </a>
  <span data-i18n="footer.copy">© 2026 — All rights reserved</span>
</footer>

<script src="mediaslide.js"></script>
<script src="i18n.js"></script>
<script>
(async function () {
  const slug = new URLSearchParams(location.search).get('slug') || '';

  let model;
  try {
    model = await window.MIRRRS.fetchModel(slug);
  } catch (err) {
    console.error(err);
    document.getElementById('model-name').textContent = 'Could not load model';
    return;
  }

  /* ---- populate the page from MediaSlide data ---- */
  document.title = `${model.name} — MIRRRS Models`;
  document.getElementById('model-name').textContent = model.name;

  /* Instagram link */
  if (model.instagram) {
    const igLink = document.getElementById('model-ig-link');
    igLink.href = model.instagram;
    igLink.style.display = 'inline-flex';
  }

  const STATS = [
    ['Height', model.stats.height],
    ['Bust',   model.stats.bust],
    ['Waist',  model.stats.waist],
    ['Hips',   model.stats.hips],
    ['Shoes',  model.stats.shoes],
    ['Hair',   model.stats.hair],
    ['Eyes',   model.stats.eyes],
  ];
  document.getElementById('model-stats').innerHTML = STATS
    .filter(([, v]) => v != null && v !== '')
    .map(([k, v]) => `<li><span>${k}</span>${v}</li>`)
    .join('');

  document.getElementById('book').innerHTML = (model.book || [])
    .map((u, i) => `<img src="${u}" alt="${model.name} — book ${i + 1}" />`)
    .join('');

  document.getElementById('polaroid-grid').innerHTML = (model.polaroids || [])
    .map((u, i) => `<img class="fade-in" src="${u}" alt="${model.name} — polaroid ${i + 1}" loading="lazy" />`)
    .join('');

  initInteractions();
})();

function initInteractions() {
  /* ---- horizontal book scroll ---- */
  const book = document.querySelector('.book');
  const arrowLeft  = document.querySelector('.book-arrow--left');
  const arrowRight = document.querySelector('.book-arrow--right');
  const progressBar = document.querySelector('.book-progress-bar');
  const step = () => Math.max(window.innerWidth * 0.55, 400);

  if (book && arrowLeft && arrowRight) {
    arrowLeft.addEventListener('click', () => book.scrollBy({ left: -step(), behavior: 'smooth' }));
    arrowRight.addEventListener('click', () => book.scrollBy({ left: step(),  behavior: 'smooth' }));
    book.addEventListener('scroll', () => {
      const max = book.scrollWidth - book.clientWidth;
      const pct = max > 0 ? (book.scrollLeft / max) * 100 : 0;
      if (progressBar) progressBar.style.width = pct + '%';
    });
  }

  /* ---- lightbox ---- */
  const lightbox = document.querySelector('.lightbox');
  const lightboxImg = document.querySelector('.lightbox-img');
  const lightboxCounter = document.querySelector('.lightbox-counter');
  const allImages = Array.from(document.querySelectorAll('.book img, .polaroid-grid img'));
  let currentIndex = 0;

  function openLightbox(i) { currentIndex = i; update(); lightbox.hidden = false; document.body.style.overflow = 'hidden'; }
  function closeLightbox() { lightbox.hidden = true; document.body.style.overflow = ''; }
  function update() {
    const img = allImages[currentIndex];
    lightboxImg.src = img.src; lightboxImg.alt = img.alt;
    lightboxCounter.textContent = (currentIndex + 1) + ' / ' + allImages.length;
  }
  function next() { currentIndex = (currentIndex + 1) % allImages.length; update(); }
  function prev() { currentIndex = (currentIndex - 1 + allImages.length) % allImages.length; update(); }

  allImages.forEach((img, i) => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => openLightbox(i));
  });
  document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
  document.querySelector('.lightbox-next').addEventListener('click', next);
  document.querySelector('.lightbox-prev').addEventListener('click', prev);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (lightbox.hidden) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowRight')  next();
    if (e.key === 'ArrowLeft')   prev();
  });

  /* ---- fade-in on scroll ---- */
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.fade-in').forEach(el => el.classList.add('is-visible'));
  }
}
</script>

</body>
</html>
